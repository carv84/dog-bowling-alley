<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coyote Bowling - Dog Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #90EE90 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #gameCanvas {
            border: 3px solid #8B4513;
            border-radius: 10px;
            background: #DEB887;
            cursor: crosshair;
            display: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 20px;
            background: rgba(139, 69, 19, 0.85);
            padding: 10px 20px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #FF4500;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 10;
            display: none;
        }
        .btn {
            background: #FF6347;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .btn:hover { background: #FF4500; }

        /* Menu Screen */
        #menuScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            text-align: center;
        }
        #menuScreen h1 {
            font-size: 48px;
            color: #8B4513;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        #menuScreen h2 {
            font-size: 24px;
            color: #5C4400;
        }
        .menu-btn {
            background: linear-gradient(180deg, #FFD700, #FFA500);
            color: #5C4400;
            border: 3px solid #8B4513;
            padding: 20px 50px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }
        .menu-btn:active { transform: scale(0.97); }
        .menu-buttons { display: flex; gap: 30px; }
        .player-indicator {
            background: rgba(0,0,0,0.15);
            padding: 4px 12px;
            border-radius: 10px;
        }
        .active-player { background: rgba(255,215,0,0.4); }

        /* Character Select Screen */
        #charSelectScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        #charSelectScreen h2 {
            font-size: 32px;
            color: #8B4513;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .dog-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 700px;
        }
        .dog-card {
            background: linear-gradient(180deg, #FFF8DC, #FAEBD7);
            border: 3px solid #8B4513;
            border-radius: 15px;
            padding: 15px;
            width: 120px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            text-align: center;
        }
        .dog-card:hover {
            transform: scale(1.08);
            box-shadow: 0 5px 12px rgba(0,0,0,0.35);
        }
        .dog-card.selected {
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.6);
            transform: scale(1.05);
        }
        .dog-card canvas {
            border-radius: 8px;
            background: #E8F5E9;
        }
        .dog-card p {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #5C4400;
        }
        .dog-card .breed-name {
            font-size: 11px;
            color: #8B6914;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <!-- Menu Screen -->
    <div id="menuScreen">
        <h1>Coyote Bowling</h1>
        <h2>Dog Edition</h2>
        <p style="font-size:18px; color:#5C4400; max-width:400px;">
            Pick your pup and hurl a squirrel to knock down coyote heads. What's not to love?
        </p>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="showCharSelect(1)">1 Player</button>
            <button class="menu-btn" onclick="showCharSelect(2)">2 Players</button>
        </div>
    </div>

    <!-- Character Select Screen -->
    <div id="charSelectScreen">
        <h2>Choose Your Dog</h2>
        <div class="dog-grid" id="dogGrid"></div>
        <button class="menu-btn" style="margin-top:15px;" onclick="confirmDogSelection()">Let's Bowl!</button>
        <button class="btn" style="margin-top:5px;" onclick="backToMenuFromSelect()">Back</button>
    </div>

    <!-- Game UI -->
    <div id="ui">
        <span id="playerTurn" class="player-indicator active-player">Player 1</span>
        <span id="dogNameDisplay" style="color:#FFF;"></span>
        <span>Frame: <span id="frame">1</span>/10</span>
        <span>Roll: <span id="roll">1</span></span>
        <span>Pins: <span id="pinsLeft">10</span></span>
        <span id="p1ScoreWrap" class="player-indicator">P1: <span id="p1Score">0</span></span>
        <span id="p2ScoreWrap" class="player-indicator" style="display:none;">P2: <span id="p2Score">0</span></span>
        <button class="btn" onclick="backToMenu()">Menu</button>
    </div>
    <div id="message"></div>
    <canvas id="gameCanvas"></canvas>
    <div id="instructions">Click and drag from the dog to aim, release to throw the squirrel!</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas sizing
function resizeCanvas() {
    canvas.width = Math.min(window.innerWidth - 20, 900);
    canvas.height = Math.min(window.innerHeight - 80, 650);
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); if (gameState !== 'menu' && gameState !== 'charselect') resetPositions(); });

// Dog breed definitions
const DOG_BREEDS = [
    { id: 'german_shepherd', name: 'Aila', breed: 'German Shepherd' },
    { id: 'westie', name: 'Truffle', breed: 'Westie' },
    { id: 'golden_retriever', name: 'Suki', breed: 'Golden Retriever' },
    { id: 'mixed', name: 'Winnie', breed: 'Mixed Breed' },
    { id: 'chihuahua', name: 'George', breed: 'Chihuahua' }
];

let selectedDogId = 'german_shepherd';
let selectedDog = DOG_BREEDS[0];

// Player / mode state
let numPlayers = 1;
let currentPlayer = 1;
let scores = [0, 0];
let playerFrames = [1, 1];
let playerRolls = [1, 1];

// Game state
let gameState = 'menu'; // menu, charselect, aiming, rolling, scored, gameover
let frame = 1, rollNum = 1;
let dragStart = null, dragEnd = null, isDragging = false;

// Physics constants
const FRICTION = 0.985;
const PIN_FRICTION = 0.95;
const BOUNCE = 0.6;
const PIN_RADIUS = 14;
const SQUIRREL_RADIUS = 16;

// Game objects
let dog = { x: 0, y: 0 };
let squirrel = { x: 0, y: 0, vx: 0, vy: 0, active: false, rotation: 0 };
let pins = [];
let knockedPins = [];
let particles = [];
let animFrameId = null;

// Waterfall animation
let waterfallTime = 0;

// Cat cheerleaders state
let catAnimTime = 0;

// Tail wag state
let tailWagTime = 0;
let tailWagging = false;

// --- Character Select ---
function showCharSelect(players) {
    numPlayers = players;
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('charSelectScreen').style.display = 'flex';
    gameState = 'charselect';
    buildDogGrid();
}

function backToMenuFromSelect() {
    document.getElementById('charSelectScreen').style.display = 'none';
    document.getElementById('menuScreen').style.display = 'flex';
    gameState = 'menu';
}

function buildDogGrid() {
    const grid = document.getElementById('dogGrid');
    grid.innerHTML = '';
    DOG_BREEDS.forEach(dog => {
        const card = document.createElement('div');
        card.className = 'dog-card' + (dog.id === selectedDogId ? ' selected' : '');
        card.onclick = () => selectDog(dog.id);
        const miniCanvas = document.createElement('canvas');
        miniCanvas.width = 90;
        miniCanvas.height = 90;
        card.appendChild(miniCanvas);
        const nameP = document.createElement('p');
        nameP.textContent = dog.name;
        card.appendChild(nameP);
        grid.appendChild(card);
        // Draw mini preview
        const mCtx = miniCanvas.getContext('2d');
        drawDogBreed(mCtx, 45, 60, dog.id, 0.6);
    });
}

function selectDog(dogId) {
    selectedDogId = dogId;
    selectedDog = DOG_BREEDS.find(d => d.id === dogId);
    buildDogGrid();
}

function confirmDogSelection() {
    document.getElementById('charSelectScreen').style.display = 'none';
    startGame();
}

// --- Menu / Start ---
function startGame() {
    currentPlayer = 1;
    scores = [0, 0];
    playerFrames = [1, 1];
    playerRolls = [1, 1];
    frame = 1;
    rollNum = 1;
    knockedPins = [];
    particles = [];
    gameState = 'aiming';

    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('charSelectScreen').style.display = 'none';
    document.getElementById('gameCanvas').style.display = 'block';
    document.getElementById('ui').style.display = 'flex';
    document.getElementById('instructions').style.display = 'block';
    document.getElementById('dogNameDisplay').textContent = selectedDog.name + ' the ' + selectedDog.breed;

    if (numPlayers === 2) {
        document.getElementById('p2ScoreWrap').style.display = '';
    } else {
        document.getElementById('p2ScoreWrap').style.display = 'none';
    }

    resizeCanvas();
    resetPositions();
    setupPins();
    updateUI();

    if (!animFrameId) gameLoop();
    showMessage("Let's Bowl! " + selectedDog.name + "! 🐕");
}

function backToMenu() {
    gameState = 'menu';
    document.getElementById('menuScreen').style.display = 'flex';
    document.getElementById('charSelectScreen').style.display = 'none';
    document.getElementById('gameCanvas').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    document.getElementById('instructions').style.display = 'none';
}

// --- Positions & Pins ---
function resetPositions() {
    dog.x = canvas.width / 2;
    dog.y = canvas.height - 80;
    squirrel.x = dog.x;
    squirrel.y = dog.y - 30;
    squirrel.active = false;
    squirrel.vx = 0;
    squirrel.vy = 0;
    squirrel.rotation = 0;
}

function setupPins() {
    pins = [];
    knockedPins = [];
    const startX = canvas.width / 2;
    const startY = 120;
    const spacing = 36;
    const rows = [1, 2, 3, 4];
    let id = 0;
    for (let row = 0; row < rows.length; row++) {
        const count = rows[row];
        const offsetX = -(count - 1) * spacing / 2;
        for (let i = 0; i < count; i++) {
            pins.push({
                id: id++,
                x: startX + offsetX + i * spacing,
                y: startY + row * spacing,
                vx: 0, vy: 0,
                knocked: false,
                rotation: 0,
                opacity: 1
            });
        }
    }
}

// --- Drawing: Scenery ---
let birds = [];
function initBirds() {
    for (let i = 0; i < 5; i++) {
        birds.push({
            x: Math.random() * 900,
            y: 30 + Math.random() * 80,
            speed: 0.5 + Math.random() * 1.5,
            wingPhase: Math.random() * Math.PI * 2,
            size: 4 + Math.random() * 4
        });
    }
}
initBirds();

function drawBird(bx, by, size, wingPhase) {
    const wing = Math.sin(wingPhase) * size;
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bx - size, by + wing);
    ctx.quadraticCurveTo(bx - size/2, by - Math.abs(wing), bx, by);
    ctx.quadraticCurveTo(bx + size/2, by - Math.abs(wing), bx + size, by + wing);
    ctx.stroke();
}

function drawTree(tx, ty, trunkH, crownR) {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath(); ctx.ellipse(tx, ty + 5, crownR * 0.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5D3A1A';
    ctx.fillRect(tx - 5, ty - trunkH, 10, trunkH);
    ctx.strokeStyle = '#3E2510'; ctx.lineWidth = 1;
    for (let i = 0; i < trunkH; i += 12) {
        ctx.beginPath(); ctx.moveTo(tx - 4, ty - i); ctx.lineTo(tx + 4, ty - i - 6); ctx.stroke();
    }
    const colors = ['#2D5A27', '#3A7A33', '#2A6B24', '#4A8A3A'];
    for (let j = 0; j < 5; j++) {
        ctx.fillStyle = colors[j % colors.length];
        const ox = (Math.sin(j * 1.8) * crownR * 0.4);
        const oy = (Math.cos(j * 1.3) * crownR * 0.3);
        ctx.beginPath();
        ctx.arc(tx + ox, ty - trunkH - crownR * 0.4 + oy, crownR * 0.55, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = '#5CA850';
    ctx.beginPath(); ctx.arc(tx, ty - trunkH - crownR * 0.7, crownR * 0.3, 0, Math.PI * 2); ctx.fill();
}

function drawPineTree(tx, ty, height) {
    // Trunk
    ctx.fillStyle = '#4A2F1A';
    ctx.fillRect(tx - 4, ty - height * 0.3, 8, height * 0.3);
    // Layers of pine
    const layers = 4;
    for (let i = 0; i < layers; i++) {
        const layerY = ty - height * 0.3 - i * (height * 0.18);
        const layerW = (height * 0.4) * (1 - i * 0.2);
        ctx.fillStyle = i % 2 === 0 ? '#1B4D1B' : '#2A6B2A';
        ctx.beginPath();
        ctx.moveTo(tx - layerW, layerY);
        ctx.lineTo(tx, layerY - height * 0.2);
        ctx.lineTo(tx + layerW, layerY);
        ctx.closePath();
        ctx.fill();
    }
}

function drawBush(bx, by, size) {
    const colors = ['#3B6B30', '#4A8B3A', '#2F5A28'];
    for (let i = 0; i < 3; i++) {
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.ellipse(bx + (i - 1) * size * 0.5, by - size * 0.3, size * 0.5, size * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = '#6BBF5A';
    ctx.beginPath(); ctx.arc(bx, by - size * 0.5, size * 0.2, 0, Math.PI * 2); ctx.fill();
}

function drawFlowerBush(bx, by, size) {
    drawBush(bx, by, size);
    // Little flowers on top
    const flowerColors = ['#FF69B4', '#FFD700', '#FF6347', '#DDA0DD'];
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = flowerColors[i];
        const fx = bx + (Math.sin(i * 2.1) * size * 0.4);
        const fy = by - size * 0.5 + (Math.cos(i * 1.7) * size * 0.2);
        ctx.beginPath(); ctx.arc(fx, fy, 3, 0, Math.PI * 2); ctx.fill();
    }
}

function drawRock(rx, ry, size) {
    // Main rock body
    ctx.fillStyle = '#7A7A7A';
    ctx.beginPath();
    ctx.ellipse(rx, ry, size, size * 0.65, 0, 0, Math.PI * 2);
    ctx.fill();
    // Highlight
    ctx.fillStyle = '#9A9A9A';
    ctx.beginPath();
    ctx.ellipse(rx - size * 0.2, ry - size * 0.2, size * 0.4, size * 0.3, -0.3, 0, Math.PI * 2);
    ctx.fill();
    // Shadow edge
    ctx.fillStyle = '#5A5A5A';
    ctx.beginPath();
    ctx.ellipse(rx + size * 0.2, ry + size * 0.15, size * 0.5, size * 0.25, 0.2, 0, Math.PI);
    ctx.fill();
}

function drawRockCluster(rx, ry, scale) {
    drawRock(rx, ry, 12 * scale);
    drawRock(rx + 10 * scale, ry - 5 * scale, 8 * scale);
    drawRock(rx - 8 * scale, ry + 3 * scale, 6 * scale);
}

function drawWaterfall(wx, wy, width, height) {
    waterfallTime += 0.03;
    // Cliff face
    ctx.fillStyle = '#5A5040';
    ctx.fillRect(wx - width/2 - 8, wy - height, width + 16, height + 10);
    ctx.fillStyle = '#6B6050';
    ctx.fillRect(wx - width/2 - 4, wy - height, width + 8, height + 5);

    // Mossy top
    ctx.fillStyle = '#3A6B30';
    ctx.beginPath();
    ctx.ellipse(wx, wy - height, width * 0.7, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Water streams
    for (let s = 0; s < 3; s++) {
        const sx = wx - width * 0.3 + s * width * 0.3;
        ctx.strokeStyle = 'rgba(180, 220, 255, 0.7)';
        ctx.lineWidth = 3 + Math.sin(waterfallTime + s) * 1;
        ctx.beginPath();
        ctx.moveTo(sx, wy - height + 5);
        for (let y = 0; y < height - 10; y += 8) {
            const wobble = Math.sin(waterfallTime * 3 + y * 0.1 + s) * 2;
            ctx.lineTo(sx + wobble, wy - height + 5 + y);
        }
        ctx.stroke();
    }

    // Splash pool at bottom
    ctx.fillStyle = 'rgba(100, 180, 220, 0.5)';
    ctx.beginPath();
    ctx.ellipse(wx, wy + 5, width * 0.8, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // Splash particles
    ctx.fillStyle = 'rgba(200, 230, 255, 0.6)';
    for (let i = 0; i < 5; i++) {
        const splashX = wx + Math.sin(waterfallTime * 2 + i * 1.3) * width * 0.4;
        const splashY = wy + 2 - Math.abs(Math.sin(waterfallTime * 3 + i)) * 8;
        ctx.beginPath(); ctx.arc(splashX, splashY, 2, 0, Math.PI * 2); ctx.fill();
    }

    // Rocks framing waterfall
    drawRock(wx - width/2 - 12, wy, 10);
    drawRock(wx + width/2 + 10, wy - 3, 9);
}

// --- Drawing: Cat Cheerleaders ---
function drawCat(cx, cy, color, phase) {
    ctx.save(); ctx.translate(cx, cy);
    const bounce = Math.sin(phase) * 3;
    const armWave = Math.sin(phase * 2) * 0.4;

    // Body
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(0, bounce, 10, 14, 0, 0, Math.PI * 2); ctx.fill();

    // Head
    ctx.beginPath(); ctx.arc(0, -16 + bounce, 10, 0, Math.PI * 2); ctx.fill();

    // Ears
    ctx.beginPath(); ctx.moveTo(-7, -22 + bounce); ctx.lineTo(-10, -32 + bounce); ctx.lineTo(-2, -24 + bounce); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(7, -22 + bounce); ctx.lineTo(10, -32 + bounce); ctx.lineTo(2, -24 + bounce); ctx.closePath(); ctx.fill();
    // Inner ears
    ctx.fillStyle = '#FFB6C1';
    ctx.beginPath(); ctx.moveTo(-6, -23 + bounce); ctx.lineTo(-8, -29 + bounce); ctx.lineTo(-3, -24 + bounce); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(6, -23 + bounce); ctx.lineTo(8, -29 + bounce); ctx.lineTo(3, -24 + bounce); ctx.closePath(); ctx.fill();

    // Eyes
    ctx.fillStyle = '#2E8B57';
    ctx.beginPath(); ctx.ellipse(-4, -17 + bounce, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -17 + bounce, 2.5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(-4, -17 + bounce, 1, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4, -17 + bounce, 1, 2.5, 0, 0, Math.PI * 2); ctx.fill();

    // Nose & mouth
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath(); ctx.moveTo(-2, -12 + bounce); ctx.lineTo(0, -10 + bounce); ctx.lineTo(2, -12 + bounce); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(0, -10 + bounce); ctx.lineTo(0, -8 + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -8 + bounce); ctx.quadraticCurveTo(-3, -6 + bounce, -4, -8 + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -8 + bounce); ctx.quadraticCurveTo(3, -6 + bounce, 4, -8 + bounce); ctx.stroke();

    // Whiskers
    ctx.strokeStyle = '#555'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(-6, -11 + bounce); ctx.lineTo(-14, -12 + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -9 + bounce); ctx.lineTo(-14, -9 + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -11 + bounce); ctx.lineTo(14, -12 + bounce); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -9 + bounce); ctx.lineTo(14, -9 + bounce); ctx.stroke();

    // Pom-pom arms (cheerleader!)
    ctx.fillStyle = color;
    // Left arm waving
    ctx.save(); ctx.translate(-10, -2 + bounce); ctx.rotate(-0.5 + armWave);
    ctx.fillRect(-2, -12, 4, 12);
    // Pom-pom
    ctx.fillStyle = '#FF1493';
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(Math.sin(i) * 4, -14 + Math.cos(i) * 3, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
    // Right arm waving
    ctx.fillStyle = color;
    ctx.save(); ctx.translate(10, -2 + bounce); ctx.rotate(0.5 - armWave);
    ctx.fillRect(-2, -12, 4, 12);
    ctx.fillStyle = '#FFD700';
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(Math.sin(i) * 4, -14 + Math.cos(i) * 3, 3, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();

    // Tail
    ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(8, 8 + bounce);
    ctx.quadraticCurveTo(18, 0 + bounce + Math.sin(phase) * 5, 14, -8 + bounce);
    ctx.stroke();

    ctx.restore();
}

function drawCatCheerleaders() {
    catAnimTime += 0.05;
    const laneLeft = canvas.width / 2 - 100;
    const laneRight = canvas.width / 2 + 100;
    const catColors = ['#FF8C00', '#808080', '#F5F5DC', '#2F2F2F'];
    // Left side cats
    for (let i = 0; i < 2; i++) {
        const cx = laneLeft - 45 - i * 30;
        const cy = canvas.height * 0.55 + i * 40;
        drawCat(cx, cy, catColors[i], catAnimTime + i * 1.2);
    }
    // Right side cats
    for (let i = 0; i < 2; i++) {
        const cx = laneRight + 45 + i * 30;
        const cy = canvas.height * 0.55 + i * 40;
        drawCat(cx, cy, catColors[i + 2], catAnimTime + i * 1.2 + 0.6);
    }
}

// --- Drawing: The Lane & Full Scene ---
function drawLane() {
    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#3A7AC9');
    skyGrad.addColorStop(0.15, '#6BAED6');
    skyGrad.addColorStop(0.3, '#A8E6A0');
    skyGrad.addColorStop(1, '#2D6B25');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ground layer (starts higher so trees are in green)
    ctx.fillStyle = '#4A8B3A';
    ctx.fillRect(0, canvas.height * 0.3, canvas.width, canvas.height * 0.7);

    // Dirt/moss texture on ground
    ctx.fillStyle = '#5B9B42';
    for (let i = 0; i < 30; i++) {
        const gx = Math.sin(i * 7.3) * canvas.width * 0.45 + canvas.width / 2;
        const gy = canvas.height * 0.38 + Math.sin(i * 3.1) * canvas.height * 0.18;
        ctx.beginPath(); ctx.arc(gx, gy, 12 + Math.sin(i) * 6, 0, Math.PI * 2); ctx.fill();
    }

    const laneLeft = canvas.width / 2 - 100;
    const laneRight = canvas.width / 2 + 100;

    // --- Waterfall (far left background) ---
    drawWaterfall(55, canvas.height * 0.42, 30, 70);

    // --- Back row trees (distant, smaller) ---
    drawPineTree(30, canvas.height * 0.40, 90);
    drawTree(100, canvas.height * 0.42, 70, 26);
    drawPineTree(canvas.width - 30, canvas.height * 0.40, 85);
    drawTree(canvas.width - 90, canvas.height * 0.43, 65, 24);
    drawPineTree(canvas.width / 2 - 180, canvas.height * 0.38, 75);
    drawPineTree(canvas.width / 2 + 180, canvas.height * 0.39, 80);
    drawTree(150, canvas.height * 0.44, 55, 22);
    drawTree(canvas.width - 160, canvas.height * 0.44, 58, 23);

    // --- Mid row trees ---
    drawTree(40, canvas.height * 0.52, 80, 30);
    drawTree(canvas.width - 50, canvas.height * 0.52, 75, 28);
    drawPineTree(110, canvas.height * 0.54, 95);
    drawPineTree(canvas.width - 120, canvas.height * 0.53, 90);

    // --- Rocks scattered ---
    drawRockCluster(laneLeft - 130, canvas.height * 0.60, 1.2);
    drawRockCluster(laneRight + 120, canvas.height * 0.58, 1.0);
    drawRock(laneLeft - 60, canvas.height * 0.72, 8);
    drawRock(laneRight + 55, canvas.height * 0.70, 7);
    drawRock(20, canvas.height * 0.85, 10);
    drawRock(canvas.width - 25, canvas.height * 0.82, 9);

    // --- Front trees (larger, flanking the lane) ---
    drawTree(laneLeft - 70, canvas.height * 0.68, 100, 38);
    drawTree(laneRight + 70, canvas.height * 0.68, 95, 36);
    drawPineTree(laneLeft - 140, canvas.height * 0.72, 115);
    drawPineTree(laneRight + 140, canvas.height * 0.72, 110);
    drawTree(laneLeft - 200, canvas.height * 0.78, 90, 34);
    drawTree(laneRight + 200, canvas.height * 0.78, 88, 33);

    // --- Bushes (lots of them!) ---
    drawBush(laneLeft - 35, canvas.height * 0.80, 20);
    drawBush(laneRight + 30, canvas.height * 0.78, 18);
    drawFlowerBush(laneLeft - 100, canvas.height * 0.85, 22);
    drawFlowerBush(laneRight + 95, canvas.height * 0.83, 20);
    drawBush(60, canvas.height * 0.90, 16);
    drawBush(canvas.width - 65, canvas.height * 0.88, 17);
    drawBush(laneLeft - 170, canvas.height * 0.90, 24);
    drawBush(laneRight + 165, canvas.height * 0.89, 22);
    drawFlowerBush(30, canvas.height * 0.95, 14);
    drawFlowerBush(canvas.width - 35, canvas.height * 0.93, 15);
    drawBush(laneLeft - 50, canvas.height * 0.94, 18);
    drawBush(laneRight + 45, canvas.height * 0.93, 16);

    // --- Lane (dirt path through forest) ---
    ctx.fillStyle = '#C4A265';
    ctx.fillRect(laneLeft, 0, 200, canvas.height);
    // Lane wood grain
    ctx.strokeStyle = 'rgba(139,90,43,0.3)';
    ctx.lineWidth = 1;
    for (let x = laneLeft; x <= laneRight; x += 18) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }

    // Gutters (mossy edges)
    ctx.fillStyle = '#5A7A40';
    ctx.fillRect(laneLeft - 15, 0, 15, canvas.height);
    ctx.fillRect(laneRight, 0, 15, canvas.height);

    // Foul line (a rough log)
    ctx.fillStyle = '#5D3A1A';
    ctx.fillRect(laneLeft - 15, canvas.height - 150, laneRight - laneLeft + 30, 6);
    ctx.fillStyle = '#3E2510';
    ctx.fillRect(laneLeft - 15, canvas.height - 148, laneRight - laneLeft + 30, 2);

    // --- Cat cheerleaders on sidelines ---
    drawCatCheerleaders();

    // Animated birds
    birds.forEach(b => {
        b.x += b.speed;
        b.wingPhase += 0.12;
        if (b.x > canvas.width + 20) { b.x = -20; b.y = 30 + Math.random() * 80; }
        drawBird(b.x, b.y, b.size, b.wingPhase);
    });
}

// --- Drawing: Dog Breeds ---
function drawDogBreed(context, x, y, breedId, scale) {
    scale = scale || 1;
    context.save();
    context.translate(x, y);
    context.scale(scale, scale);
    switch(breedId) {
        case 'german_shepherd': drawGermanShepherd(context); break;
        case 'westie': drawWestie(context); break;
        case 'golden_retriever': drawGoldenRetriever(context); break;
        case 'mixed': drawWinnie(context); break;
        case 'chihuahua': drawChihuahua(context); break;
    }
    context.restore();
}

function drawWestie(c, wag) {

        const fx = Math.sin(i * 0.9) * 14;

    c.beginPath(); c.moveTo(8, -26); c.lineTo(12, -38); c.lineTo(3, -28); c.closePath(); c.fill();

    c.beginPath(); c.moveTo(-3, -10); c.quadraticCurveTo(0, -7, 3, -10); c.stroke();

    c.beginPath(); c.moveTo(-8, -23); c.quadraticCurveTo(-6, -27, -4, -23); c.stroke();
    c.restore();
    // Blue collar with tag
    c.fillStyle = '#4488CC';
    c.beginPath(); c.ellipse(0, -5, 14, 3, 0, 0, Math.PI); c.fill();
    // Tag
    c.fillStyle = '#FFD700';
    c.beginPath(); c.arc(0, -2, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#B8860B';
    c.font = '5px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('W', 0, -2);
}

function drawChihuahua(c, wag) {
    wag = wag || 0;
    // George the Chihuahua - tiny, big eyes, big ears, attitude
    // Shadow
    c.fillStyle = 'rgba(0,0,0,0.15)';
    c.beginPath(); c.ellipse(0, 26, 16, 5, 0, 0, Math.PI * 2); c.fill();
    // Body (small, tan)
    c.fillStyle = '#C8963E';
    c.beginPath(); c.ellipse(0, 12, 16, 14, 0, 0, Math.PI * 2); c.fill();
    // Lighter chest
    c.fillStyle = '#E8C870';
    c.beginPath(); c.ellipse(0, 18, 10, 8, 0, 0, Math.PI); c.fill();
    // Tiny legs
    c.fillStyle = '#B08030';
    c.fillRect(-8, 22, 5, 8); c.fillRect(4, 22, 5, 8);
    // Tiny paws
    c.fillStyle = '#C8963E';
    c.beginPath(); c.ellipse(-5, 30, 4, 3, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7, 30, 4, 3, 0, 0, Math.PI * 2); c.fill();
    // Big round head (apple-shaped - classic chihuahua)
    c.fillStyle = '#C8963E';
    c.beginPath(); c.arc(0, -10, 16, 0, Math.PI * 2); c.fill();
    // Forehead dome
    c.fillStyle = '#D4A040';
    c.beginPath(); c.arc(0, -14, 10, Math.PI, Math.PI * 2); c.fill();
    // Enormous ears (chihuahua signature!)
    c.fillStyle = '#B08030';
    c.beginPath(); c.moveTo(-10, -16); c.lineTo(-24, -32); c.lineTo(-22, -14); c.quadraticCurveTo(-14, -10, -10, -16); c.fill();
    c.beginPath(); c.moveTo(10, -16); c.lineTo(24, -32); c.lineTo(22, -14); c.quadraticCurveTo(14, -10, 10, -16); c.fill();
    // Inner ears
    c.fillStyle = '#FFD1DC';
    c.beginPath(); c.moveTo(-12, -16); c.lineTo(-20, -28); c.lineTo(-18, -14); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(12, -16); c.lineTo(20, -28); c.lineTo(18, -14); c.closePath(); c.fill();
    // Huge eyes (chihuahua bug eyes)
    c.fillStyle = '#FFFFFF';
    c.beginPath(); c.arc(-5, -10, 5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(5, -10, 5, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#2A1500';
    c.beginPath(); c.arc(-5, -10, 3.5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(5, -10, 3.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#FFF';
    c.beginPath(); c.arc(-4, -11, 1.5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(6, -11, 1.5, 0, Math.PI * 2); c.fill();
    // Tiny nose
    c.fillStyle = '#1A1A1A';
    c.beginPath(); c.ellipse(0, -3, 3, 2.5, 0, 0, Math.PI * 2); c.fill();
    // Sassy little mouth
    c.strokeStyle = '#1A1A1A'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(-3, 0); c.quadraticCurveTo(0, 2, 3, 0); c.stroke();
    // Tiny tail (curved up, sassy - thicker and more visible)
    c.save(); c.translate(-10, 8); c.rotate(wag);
    c.strokeStyle = '#A07828'; c.lineWidth = 5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-12, -8, -6, -18); c.stroke();
    c.strokeStyle = '#C8963E'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(-12, -8, -6, -18); c.stroke();
    // Tip
    c.fillStyle = '#C8963E';
    c.beginPath(); c.arc(-6, -18, 3, 0, Math.PI * 2); c.fill();
    c.restore();
    // Rhinestone collar (George has style)
    c.fillStyle = '#8B0000';
    c.beginPath(); c.ellipse(0, 2, 10, 2.5, 0, 0, Math.PI); c.fill();
    c.fillStyle = '#00FFFF';
    for (let s = -2; s <= 2; s++) { c.beginPath(); c.arc(s * 4, 2, 1.5, 0, Math.PI * 2); c.fill(); }
}

// --- Main Dog Draw (uses selected breed) ---
function drawDog(x, y) {
    ctx.save(); ctx.translate(x, y);

    // Update tail wag
    if (tailWagging) {
        tailWagTime += 0.15;
        if (tailWagTime > Math.PI * 6) { tailWagging = false; tailWagTime = 0; }
    }
    const wagAngle = tailWagging ? Math.sin(tailWagTime * 4) * 0.3 : 0;

    drawDogBreedWithWag(ctx, 0, 0, selectedDogId, 1, wagAngle);
    // Player number badge (2-player mode)
    if (numPlayers === 2) {
        ctx.fillStyle = currentPlayer === 1 ? '#4488FF' : '#FF4488';
        ctx.beginPath(); ctx.arc(28, -35, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFF'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('P' + currentPlayer, 28, -35);
    }
    ctx.restore();
}

function drawDogBreedWithWag(context, x, y, breedId, scale, wagAngle) {
    scale = scale || 1;
    context.save();
    context.translate(x, y);
    context.scale(scale, scale);
    switch(breedId) {
        case 'german_shepherd': drawGermanShepherd(context, wagAngle); break;
        case 'westie': drawWestie(context, wagAngle); break;
        case 'golden_retriever': drawGoldenRetriever(context, wagAngle); break;
        case 'mixed': drawWinnie(context, wagAngle); break;
        case 'chihuahua': drawChihuahua(context, wagAngle); break;
    }
    context.restore();
}

function drawSquirrel(x, y, rotation) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotation);
    ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.ellipse(0, 0, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#A0522D'; ctx.beginPath(); ctx.arc(10, -4, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6B3410'; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.quadraticCurveTo(-22, -15, -15, -22); ctx.quadraticCurveTo(-8, -18, -10, -5); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(12, -5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#A0522D'; ctx.beginPath(); ctx.arc(8, -10, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawCoyotePin(pin) {
    ctx.save(); ctx.translate(pin.x, pin.y); ctx.rotate(pin.rotation); ctx.globalAlpha = pin.opacity;
    ctx.fillStyle = '#D4D4D4'; ctx.beginPath(); ctx.moveTo(-5, 10); ctx.lineTo(5, 10); ctx.lineTo(3, 20); ctx.lineTo(-3, 20); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#A0896C'; ctx.beginPath(); ctx.ellipse(0, -2, 13, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#C4A882'; ctx.beginPath(); ctx.ellipse(0, 6, 7, 8, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#7A6B5A';
    ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-12, -26); ctx.lineTo(-3, -14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -12); ctx.lineTo(12, -26); ctx.lineTo(3, -14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#C4956A';
    ctx.beginPath(); ctx.moveTo(-8, -14); ctx.lineTo(-10, -22); ctx.lineTo(-5, -14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8, -14); ctx.lineTo(10, -22); ctx.lineTo(5, -14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(-5, -5, 4, 0, Math.PI * 2); ctx.arc(5, -5, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-5, -5, 2, 0, Math.PI * 2); ctx.arc(5, -5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.ellipse(0, 4, 3, 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-5, 9); ctx.quadraticCurveTo(0, 12, 5, 9); ctx.stroke();
    ctx.restore();
}

function drawAimLine() {
    if (isDragging && dragStart && dragEnd) {
        const dx = dragStart.x - dragEnd.x;
        const dy = dragStart.y - dragEnd.y;
        const power = Math.min(Math.sqrt(dx * dx + dy * dy), 200);
        const angle = Math.atan2(dy, dx);
        ctx.strokeStyle = 'rgba(255,' + Math.max(0, 255 - Math.floor(power)) + ',0,0.8)';
        ctx.lineWidth = 3; ctx.setLineDash([8, 4]);
        ctx.beginPath(); ctx.moveTo(dog.x, dog.y - 30);
        ctx.lineTo(dog.x + Math.cos(angle) * power, dog.y - 30 + Math.sin(angle) * power);
        ctx.stroke(); ctx.setLineDash([]);
        const barWidth = 120, barHeight = 12;
        const barX = dog.x - barWidth / 2, barY = dog.y + 35;
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
        const ratio = power / 200;
        const gradient = ctx.createLinearGradient(barX, 0, barX + barWidth, 0);
        gradient.addColorStop(0, '#00FF00'); gradient.addColorStop(0.5, '#FFFF00'); gradient.addColorStop(1, '#FF0000');
        ctx.fillStyle = gradient; ctx.fillRect(barX, barY, barWidth * ratio, barHeight);
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life -= 0.02;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function spawnParticles(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
        particles.push({ x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8-3, size: Math.random()*4+2, color: colors[Math.floor(Math.random()*colors.length)], life: 1 });
    }
}

// --- Physics ---
function updateSquirrel() {
    if (!squirrel.active) return;
    squirrel.x += squirrel.vx; squirrel.y += squirrel.vy;
    squirrel.vx *= FRICTION; squirrel.vy *= FRICTION;
    squirrel.rotation += squirrel.vx * 0.05;
    const laneLeft = canvas.width / 2 - 100, laneRight = canvas.width / 2 + 100;
    if (squirrel.x < laneLeft + SQUIRREL_RADIUS) { squirrel.x = laneLeft + SQUIRREL_RADIUS; squirrel.vx *= -BOUNCE; }
    if (squirrel.x > laneRight - SQUIRREL_RADIUS) { squirrel.x = laneRight - SQUIRREL_RADIUS; squirrel.vx *= -BOUNCE; }
    if (squirrel.y < -50) { squirrel.active = false; setTimeout(settleRoll, 500); }
    const speed = Math.sqrt(squirrel.vx * squirrel.vx + squirrel.vy * squirrel.vy);
    if (speed < 0.3 && gameState === 'rolling') { squirrel.active = false; setTimeout(settleRoll, 500); }
}

function checkCollisions() {
    if (!squirrel.active) return;
    pins.forEach(pin => {
        if (pin.knocked) return;
        const dx = squirrel.x - pin.x, dy = squirrel.y - pin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < SQUIRREL_RADIUS + PIN_RADIUS) {
            pin.knocked = true;
            const angle = Math.atan2(dy, dx);
            pin.vx = -Math.cos(angle) * 5 + squirrel.vx * 0.3;
            pin.vy = -Math.sin(angle) * 5 + squirrel.vy * 0.3;
            squirrel.vx *= 0.85; squirrel.vy *= 0.85;
            spawnParticles(pin.x, pin.y, 8, ['#FFD700', '#FF6347', '#FF4500']);
            tailWagging = true;
            tailWagTime = 0;
            checkPinChain(pin);
        }
    });
}

function checkPinChain(hitPin) {
    pins.forEach(otherPin => {
        if (otherPin.knocked || otherPin.id === hitPin.id) return;
        const dx = hitPin.x - otherPin.x, dy = hitPin.y - otherPin.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < PIN_RADIUS * 2.5) {
            otherPin.knocked = true;
            const angle = Math.atan2(dy, dx);
            otherPin.vx = -Math.cos(angle) * 3; otherPin.vy = -Math.sin(angle) * 3;
            spawnParticles(otherPin.x, otherPin.y, 5, ['#FFD700', '#FFA500']);
        }
    });
}

function updatePins() {
    pins.forEach(pin => {
        if (!pin.knocked) return;
        pin.x += pin.vx; pin.y += pin.vy;
        pin.vx *= PIN_FRICTION; pin.vy *= PIN_FRICTION;
        pin.rotation += pin.vx * 0.1;
        pin.opacity = Math.max(0, pin.opacity - 0.008);
    });
}

// --- Scoring & Turns ---
function settleRoll() {
    gameState = 'scored';
    const knockedCount = pins.filter(p => p.knocked).length;
    const prevKnocked = knockedPins.length;
    const newKnocked = knockedCount - prevKnocked;
    knockedPins = pins.filter(p => p.knocked);

    const pi = currentPlayer - 1;

    if (rollNum === 1 && knockedCount === 10) {
        showMessage("STRIKE! 🎳");
        scores[pi] += 10;
        spawnParticles(canvas.width/2, canvas.height/2, 30, ['#FFD700','#FF0000','#00FF00','#0000FF']);
        advanceTurn();
    } else if (rollNum === 2 && knockedCount === 10) {
        showMessage("SPARE! ✨");
        scores[pi] += 10;
        spawnParticles(canvas.width/2, canvas.height/2, 20, ['#FFD700','#FFA500']);
        advanceTurn();
    } else if (rollNum === 2) {
        scores[pi] += knockedCount;
        advanceTurn();
    } else {
        scores[pi] += newKnocked;
        rollNum = 2;
        playerRolls[pi] = 2;
        gameState = 'aiming';
        resetPositions();
    }
    updateUI();
}

function advanceTurn() {
    const pi = currentPlayer - 1;
    if (numPlayers === 2) {
        if (currentPlayer === 1) {
            currentPlayer = 2;
            rollNum = 1;
            playerRolls[1] = 1;
            knockedPins = [];
            setupPins();
            resetPositions();
            gameState = 'aiming';
            showMessage("Player 2's turn!");
        } else {
            if (playerFrames[0] >= 10 && playerFrames[1] >= 10) { endGame(); return; }
            playerFrames[0]++;
            playerFrames[1]++;
            frame = playerFrames[0];
            currentPlayer = 1;
            rollNum = 1;
            playerRolls[0] = 1;
            knockedPins = [];
            setupPins();
            resetPositions();
            gameState = 'aiming';
            showMessage("Frame " + frame + " - Player 1!");
        }
    } else {
        if (playerFrames[0] >= 10) { endGame(); return; }
        playerFrames[0]++;
        frame = playerFrames[0];
        rollNum = 1;
        knockedPins = [];
        setupPins();
        resetPositions();
        gameState = 'aiming';
    }
    updateUI();
}

function endGame() {
    gameState = 'gameover';
    if (numPlayers === 2) {
        if (scores[0] > scores[1]) showMessage("Player 1 Wins! " + scores[0] + " - " + scores[1]);
        else if (scores[1] > scores[0]) showMessage("Player 2 Wins! " + scores[1] + " - " + scores[0]);
        else showMessage("It's a Tie! " + scores[0] + " each!");
    } else {
        showMessage("Game Over! Score: " + scores[0]);
    }
}

function showMessage(text) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; }, 2500);
}

function updateUI() {
    document.getElementById('frame').textContent = frame;
    document.getElementById('roll').textContent = rollNum;
    document.getElementById('pinsLeft').textContent = 10 - pins.filter(p => p.knocked).length;
    document.getElementById('p1Score').textContent = scores[0];
    document.getElementById('p2Score').textContent = scores[1];
    const turnEl = document.getElementById('playerTurn');
    turnEl.textContent = numPlayers === 2 ? 'Player ' + currentPlayer : 'Player 1';
    turnEl.style.background = currentPlayer === 1 ? 'rgba(68,136,255,0.4)' : 'rgba(255,68,136,0.4)';
    document.getElementById('dogNameDisplay').textContent = selectedDog.name + ' the ' + selectedDog.breed;
}

// --- Input ---
canvas.addEventListener('mousedown', (e) => {
    if (gameState !== 'aiming') return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    if (Math.sqrt((mx - dog.x) ** 2 + (my - dog.y) ** 2) < 60) {
        isDragging = true; dragStart = { x: mx, y: my }; dragEnd = { x: mx, y: my };
    }
});
canvas.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const rect = canvas.getBoundingClientRect();
    dragEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };
});
canvas.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    const dx = dragStart.x - dragEnd.x, dy = dragStart.y - dragEnd.y;
    const power = Math.min(Math.sqrt(dx*dx+dy*dy), 200) / 10;
    if (power < 1) return;
    const angle = Math.atan2(dy, dx);
    squirrel.vx = Math.cos(angle) * power; squirrel.vy = Math.sin(angle) * power;
    squirrel.active = true; gameState = 'rolling';
});

// Touch
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState !== 'aiming') return;
    const t = e.touches[0], rect = canvas.getBoundingClientRect();
    const mx = t.clientX - rect.left, my = t.clientY - rect.top;
    if (Math.sqrt((mx-dog.x)**2+(my-dog.y)**2) < 80) {
        isDragging = true; dragStart = {x:mx,y:my}; dragEnd = {x:mx,y:my};
    }
});
canvas.addEventListener('touchmove', (e) => {
    e.preventDefault(); if (!isDragging) return;
    const t = e.touches[0], rect = canvas.getBoundingClientRect();
    dragEnd = { x: t.clientX-rect.left, y: t.clientY-rect.top };
});
canvas.addEventListener('touchend', (e) => {
    e.preventDefault(); if (!isDragging) return;
    isDragging = false;
    const dx = dragStart.x-dragEnd.x, dy = dragStart.y-dragEnd.y;
    const power = Math.min(Math.sqrt(dx*dx+dy*dy),200)/10;
    if (power < 1) return;
    const angle = Math.atan2(dy, dx);
    squirrel.vx = Math.cos(angle)*power; squirrel.vy = Math.sin(angle)*power;
    squirrel.active = true; gameState = 'rolling';
});

// --- Game Loop ---
function gameLoop() {
    animFrameId = requestAnimationFrame(gameLoop);
    if (gameState === 'menu' || gameState === 'charselect') return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawLane();
    pins.forEach(pin => { if (!pin.knocked) drawCoyotePin(pin); });
    pins.forEach(pin => { if (pin.knocked) drawCoyotePin(pin); });
    if (squirrel.active) { drawSquirrel(squirrel.x, squirrel.y, squirrel.rotation); }
    else if (gameState === 'aiming') { drawSquirrel(squirrel.x, squirrel.y, 0); }
    drawDog(dog.x, dog.y);
    if (gameState === 'aiming') drawAimLine();
    drawParticles();

    if (gameState === 'rolling') { updateSquirrel(); checkCollisions(); updatePins(); }
}

// Kick off loop (stays idle until startGame is called)
gameLoop();
</script>
